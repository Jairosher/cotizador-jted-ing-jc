<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo y Cotizador de Equipos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ID limpio de tu Google Sheet "Cotizador JTED"
    const SHEET_ID = "1sxgV7kpbdx2y4BoJKfeF7Fu8CPrvmKZO9YqFiJhgyqg";

    function calcularGama(pvpPospago) {
      const p = Number(pvpPospago) || 0;
      if (p <= 80) return "MUY BAJA";
      if (p <= 200) return "BAJA";
      if (p <= 400) return "MEDIA";
      if (p <= 680) return "ALTA";
      return "PREMIUM";
    }

    function formatCurrency(val) {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(Number(val) || 0);
    }

    function App() {
      const [tab, setTab] = useState("cotizador");
      const [loading, setLoading] = useState(true);
      const [estadoConexion, setEstadoConexion] = useState({ ok: false, texto: "SINCRONIZANDO..." });

      // Estados inicialmente vacíos: SOLO se llenan desde Google Sheets
      const [params, setParams] = useState({
        vigencia: "Sin definir en hoja 'parametros'",
        tasa_regular: 15.79,
        tasa_diners: 8.25,
        iva: 0.15
      });
      const [equipos, setEquipos] = useState([]);
      const [planes, setPlanes] = useState([]);

      // Estados del Cotizador
      const [modalidadCotizador, setModalidadCotizador] = useState("REGULAR");
      const [cliente, setCliente] = useState("MASIVO");
      const [tipoVenta, setTipoVenta] = useState("DIFERIDO CNT");
      const [smartflexSeleccionado, setSmartflexSeleccionado] = useState("");
      const [codigoPlanSeleccionado, setCodigoPlanSeleccionado] = useState("");
      const [abono, setAbono] = useState(0);
      const [plazo, setPlazo] = useState(12);

      // Filtros Catálogo
      const [busqueda, setBusqueda] = useState("");
      const [filtroMarca, setFiltroMarca] = useState("TODAS");
      const [filtroGama, setFiltroGama] = useState("TODAS");

      async function cargarGoogleSheets() {
        setLoading(true);
        try {
          // Timestamp anti-caché para traer siempre el último cambio del Sheet
          const t = Date.now();
          const [resEq, resPl, resPa] = await Promise.all([
            fetch(`https://opensheet.elk.sh/${SHEET_ID}/equipos?t=${t}`).then(r => r.json()),
            fetch(`https://opensheet.elk.sh/${SHEET_ID}/planes?t=${t}`).then(r => r.json()),
            fetch(`https://opensheet.elk.sh/${SHEET_ID}/parametros?t=${t}`).then(r => r.json())
          ]);

          if (resEq.error || resPl.error || resPa.error) {
            setEstadoConexion({
              ok: false,
              texto: `ERROR SHEET: ${resEq.error || resPl.error || resPa.error}`
            });
            setEquipos([]);
            setPlanes([]);
            return;
          }

          const eqLimpios = Array.isArray(resEq)
            ? resEq
                .filter(e => String(e.activo || "SI").toUpperCase() === "SI" && e.modelo)
                .map(e => ({
                  ...e,
                  pvp_prepago_sin_iva: parseFloat(String(e.pvp_prepago_sin_iva).replace(",", ".")) || 0,
                  pvp_pospago_sin_iva: parseFloat(String(e.pvp_pospago_sin_iva).replace(",", ".")) || 0,
                  pvp_empresa_sin_iva: parseFloat(String(e.pvp_empresa_sin_iva).replace(",", ".")) || 0,
                }))
            : [];

          const plLimpios = Array.isArray(resPl)
            ? resPl
                .filter(p => p.plan)
                .map(p => ({
                  ...p,
                  tarifa: parseFloat(String(p.tarifa).replace(",", ".")) || 0,
                  cbm: parseFloat(String(p.cbm).replace(",", ".")) || 0,
                }))
            : [];

          setEquipos(eqLimpios);
          setPlanes(plLimpios);

          if (eqLimpios.length > 0) setSmartflexSeleccionado(eqLimpios[0].codigo_smartflex);
          if (plLimpios.length > 0) setCodigoPlanSeleccionado(plLimpios[0].codigo);

          if (Array.isArray(resPa) && resPa.length > 0) {
            const mapParams = {};
            resPa.forEach(item => {
              if (item.clave) mapParams[item.clave.trim()] = item.valor;
            });
            setParams(prev => ({
              vigencia: mapParams.vigencia || prev.vigencia,
              tasa_regular: parseFloat(mapParams.tasa_regular) || prev.tasa_regular,
              tasa_diners: parseFloat(mapParams.tasa_diners) || prev.tasa_diners,
              iva: parseFloat(mapParams.iva) || prev.iva,
            }));
          }

          setEstadoConexion({
            ok: true,
            texto: `CONECTADO (${eqLimpios.length} equipos, ${plLimpios.length} planes)`
          });
        } catch (err) {
          console.error(err);
          setEstadoConexion({ ok: false, texto: "ERROR DE RED O PERMISOS EN GOOGLE SHEETS" });
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => {
        cargarGoogleSheets();
      }, []);

      useEffect(() => {
        const planesFiltrados = planes.filter(p => String(p.tipo).toUpperCase() === cliente);
        if (planesFiltrados.length > 0 && !planesFiltrados.some(p => String(p.codigo) === String(codigoPlanSeleccionado))) {
          setCodigoPlanSeleccionado(planesFiltrados[0].codigo);
        }
      }, [cliente, planes]);

      const equipoActual = useMemo(
        () => equipos.find(e => String(e.codigo_smartflex) === String(smartflexSeleccionado)) || equipos[0] || null,
        [equipos, smartflexSeleccionado]
      );

      const planesDisponibles = useMemo(
        () => planes.filter(p => String(p.tipo).toUpperCase() === cliente),
        [planes, cliente]
      );

      const planActual = useMemo(
        () => planesDisponibles.find(p => String(p.codigo) === String(codigoPlanSeleccionado)) || planesDisponibles[0] || { tarifa: 0, cbm: 0, plan: "Sin plan" },
        [planesDisponibles, codigoPlanSeleccionado]
      );

      const resultadoCotizacion = useMemo(() => {
        if (!equipoActual) return null;

        const esDiners = modalidadCotizador === "DINERS";
        const iva = Number(params.iva) || 0.15;
        const tasaAnual = esDiners ? Number(params.tasa_diners) : Number(params.tasa_regular);
        const interesMensual = Math.pow(tasaAnual / 100 + 1, 1 / 12) - 1;

        let precioSinIva = equipoActual.pvp_pospago_sin_iva;
        if (!esDiners && cliente === "MASIVO" && tipoVenta === "ROL DE PAGOS") {
          precioSinIva = equipoActual.pvp_prepago_sin_iva;
        } else if (cliente === "CORPORATIVO") {
          precioSinIva = equipoActual.pvp_empresa_sin_iva;
        }

        const precioConIva = precioSinIva * (1 + iva);
        const abonoNum = Math.max(0, Number(abono) || 0);
        const descuentoCbm = esDiners ? 0 : (Number(planActual.tarifa) * Number(planActual.cbm));
        const saldoFinanciar = Math.max(0, precioConIva - abonoNum - descuentoCbm);

        let cuotaEquipoConIva = 0;
        if (plazo > 6) {
          const factor = Math.pow(1 + interesMensual, plazo);
          cuotaEquipoConIva = Number(((saldoFinanciar * interesMensual * factor) / (factor - 1)).toFixed(2));
        } else {
          cuotaEquipoConIva = Number((saldoFinanciar / plazo).toFixed(2));
        }

        const cuotaEquipoSinIva = cuotaEquipoConIva / (1 + iva);
        const planConIva = Number(planActual.tarifa) * (1 + iva);
        const cuotaTotalSinIva = cuotaEquipoSinIva + Number(planActual.tarifa);
        const cuotaTotalConIva = cuotaEquipoConIva + planConIva;
        const totalFrdi = plazo > 6 ? Number((cuotaEquipoConIva * plazo).toFixed(2)) : saldoFinanciar;

        return {
          gama: calcularGama(equipoActual.pvp_pospago_sin_iva),
          tasaAnual,
          interesMensual: (interesMensual * 100).toFixed(4),
          precioSinIva,
          precioConIva,
          descuentoCbm,
          saldoFinanciar,
          cuotaEquipoSinIva,
          cuotaEquipoConIva,
          planConIva,
          cuotaTotalSinIva,
          cuotaTotalConIva,
          totalFrdi
        };
      }, [equipoActual, planActual, modalidadCotizador, cliente, tipoVenta, abono, plazo, params]);

      const marcasUnicas = useMemo(() => ["TODAS", ...new Set(equipos.map(e => e.marca))], [equipos]);
      const equiposFiltrados = useMemo(() => {
        return equipos.filter(eq => {
          const gamaEq = calcularGama(eq.pvp_pospago_sin_iva);
          const matchTexto = eq.modelo.toLowerCase().includes(busqueda.toLowerCase()) ||
                             String(eq.codigo_smartflex).includes(busqueda) ||
                             String(eq.codigo_sap).includes(busqueda);
          const matchMarca = filtroMarca === "TODAS" || eq.marca === filtroMarca;
          const matchGama = filtroGama === "TODAS" || gamaEq === filtroGama;
          return matchTexto && matchMarca && matchGama;
        });
      }, [equipos, busqueda, filtroMarca, filtroGama]);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-blue-900 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div>
                <h1 className="text-xl md:text-2xl font-bold tracking-tight">
                  Catálogo & Cotizador de Terminales
                </h1>
                <p className="text-blue-200 text-sm">
                  Vigencia: <span className="font-semibold text-white">{params.vigencia}</span> • IVA: {(params.iva * 100).toFixed(0)}%
                </p>
              </div>
              <div className="flex items-center gap-2">
                <span className={`text-xs px-3 py-1 rounded-full font-medium ${estadoConexion.ok ? "bg-emerald-500/20 text-emerald-200 border border-emerald-400/30" : "bg-rose-500/20 text-rose-200 border border-rose-400/30"}`}>
                  {loading ? "Sincronizando..." : estadoConexion.texto}
                </span>
                <button
                  onClick={cargarGoogleSheets}
                  className="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full transition"
                  title="Volver a leer Google Sheets"
                >
                  ↻ Actualizar
                </button>
              </div>
            </div>

            <div className="bg-blue-950/60 border-t border-blue-800">
              <div className="max-w-7xl mx-auto px-4 flex space-x-2 overflow-x-auto">
                {[
                  { id: "cotizador", label: "Cotizador de Equipos" },
                  { id: "catalogo", label: `Lista de Precios (${equipos.length})` },
                  { id: "planes", label: `Planes Autorizados (${planes.length})` }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`px-4 py-3 text-sm font-medium border-b-2 whitespace-nowrap transition-colors ${
                      tab === item.id ? "border-cyan-400 text-white" : "border-transparent text-blue-300 hover:text-white"
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {!loading && equipos.length === 0 && (
              <div className="bg-white border border-amber-300 rounded-xl p-6 text-center max-w-xl mx-auto my-8 shadow-sm">
                <h2 className="text-lg font-bold text-slate-800">No hay equipos cargados desde Google Sheets</h2>
                <p className="text-sm text-slate-600 mt-2">
                  Verifica que tu hoja <b>Cotizador JTED</b> esté compartida como <b>"Cualquier persona con el enlace (Lector)"</b> y que la pestaña <b>equipos</b> tenga datos debajo de los encabezados en la Fila 1.
                </p>
              </div>
            )}

            {tab === "cotizador" && resultadoCotizacion && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b pb-4">
                    <h2 className="text-lg font-bold text-slate-800">Configuración de Cotización</h2>
                    <div className="inline-flex rounded-lg bg-slate-100 p-1">
                      <button
                        onClick={() => setModalidadCotizador("REGULAR")}
                        className={`px-3 py-1.5 text-xs font-semibold rounded-md transition ${modalidadCotizador === "REGULAR" ? "bg-blue-700 text-white shadow" : "text-slate-600"}`}
                      >
                        Cotizador Regular ({params.tasa_regular}%)
                      </button>
                      <button
                        onClick={() => setModalidadCotizador("DINERS")}
                        className={`px-3 py-1.5 text-xs font-semibold rounded-md transition ${modalidadCotizador === "DINERS" ? "bg-indigo-700 text-white shadow" : "text-slate-600"}`}
                      >
                        Tarjeta Diners ({params.tasa_diners}%)
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Tipo de Cliente</label>
                      <select
                        value={cliente}
                        onChange={e => setCliente(e.target.value)}
                        className="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm bg-white"
                      >
                        <option value="MASIVO">MASIVO</option>
                        <option value="CORPORATIVO">CORPORATIVO</option>
                      </select>
                    </div>

                    {modalidadCotizador === "REGULAR" && (
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Tipo de Venta</label>
                        <select
                          value={tipoVenta}
                          onChange={e => setTipoVenta(e.target.value)}
                          disabled={cliente === "CORPORATIVO"}
                          className="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm bg-white disabled:bg-slate-100"
                        >
                          <option value="DIFERIDO CNT">DIFERIDO CNT (PVP Pospago)</option>
                          <option value="ROL DE PAGOS">ROL DE PAGOS (PVP Prepago)</option>
                        </select>
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Equipo Terminal</label>
                    <select
                      value={smartflexSeleccionado}
                      onChange={e => setSmartflexSeleccionado(e.target.value)}
                      className="w-full rounded-lg border-slate-300 border px-3 py-2.5 text-sm font-medium bg-white"
                    >
                      {equipos.map(eq => (
                        <option key={eq.codigo_smartflex} value={eq.codigo_smartflex}>
                          [{eq.codigo_smartflex}] {eq.modelo} — ({eq.tecnologia})
                        </option>
                      ))}
                    </select>
                    <div className="mt-2 flex flex-wrap gap-2 text-xs">
                      <span className="bg-slate-100 px-2.5 py-1 rounded text-slate-600">SAP: <b>{equipoActual.codigo_sap}</b></span>
                      <span className="bg-blue-50 text-blue-700 px-2.5 py-1 rounded font-semibold">Gama: {resultadoCotizacion.gama}</span>
                      <span className="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded font-semibold">{equipoActual.observacion}</span>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Plan Tarifario ({cliente})</label>
                    <select
                      value={codigoPlanSeleccionado}
                      onChange={e => setCodigoPlanSeleccionado(e.target.value)}
                      className="w-full rounded-lg border-slate-300 border px-3 py-2.5 text-sm bg-white"
                    >
                      {planesDisponibles.map(pl => (
                        <option key={pl.codigo} value={pl.codigo}>
                          [{pl.codigo}] {pl.plan} — Tarifa: {formatCurrency(pl.tarifa)} + IVA {pl.cbm > 0 ? `(CBM: ${pl.cbm})` : ""}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Abono Inicial (USD inc. IVA)</label>
                      <input
                        type="number"
                        min="0"
                        step="1"
                        value={abono}
                        onChange={e => setAbono(e.target.value)}
                        className="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Plazo en Meses</label>
                      <select
                        value={plazo}
                        onChange={e => setPlazo(Number(e.target.value))}
                        className="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm font-semibold bg-white"
                      >
                        {[3, 6, 9, 12, 18, 24].map(m => (
                          <option key={m} value={m}>
                            {m} meses {m <= 6 ? "(Sin intereses)" : `(Con tasa ${resultadoCotizacion.tasaAnual}%)`}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-gradient-to-br from-blue-900 to-slate-900 text-white rounded-xl shadow-md p-6">
                    <div className="text-xs uppercase tracking-wider text-blue-300 font-semibold">
                      Cuota Mensual Total (Equipo + Plan)
                    </div>
                    <div className="mt-2 flex items-baseline gap-2">
                      <span className="text-4xl font-extrabold">{formatCurrency(resultadoCotizacion.cuotaTotalConIva)}</span>
                      <span className="text-sm text-blue-200">/ mes inc. IVA</span>
                    </div>
                    <div className="text-xs text-blue-300 mt-1">
                      Sin IVA: {formatCurrency(resultadoCotizacion.cuotaTotalSinIva)} / mes
                    </div>

                    <div className="mt-6 pt-4 border-t border-white/15 grid grid-cols-2 gap-4 text-sm">
                      <div>
                        <span className="block text-xs text-blue-300">Cuota Equipo (inc. IVA)</span>
                        <span className="text-lg font-bold">{formatCurrency(resultadoCotizacion.cuotaEquipoConIva)}</span>
                      </div>
                      <div>
                        <span className="block text-xs text-blue-300">Tarifa Plan (inc. IVA)</span>
                        <span className="text-lg font-bold">{formatCurrency(resultadoCotizacion.planConIva)}</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3 text-sm">
                    <h3 className="font-bold text-slate-800 border-b pb-2">Desglose para Sistema / FRDI</h3>
                    <div className="flex justify-between">
                      <span className="text-slate-500">PVP Equipo (sin IVA):</span>
                      <span className="font-medium">{formatCurrency(resultadoCotizacion.precioSinIva)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">PVP Equipo (inc. IVA):</span>
                      <span className="font-medium">{formatCurrency(resultadoCotizacion.precioConIva)}</span>
                    </div>
                    {resultadoCotizacion.descuentoCbm > 0 && (
                      <div className="flex justify-between text-emerald-700">
                        <span>Descuento CBM ({planActual.cbm} meses):</span>
                        <span className="font-semibold">- {formatCurrency(resultadoCotizacion.descuentoCbm)}</span>
                      </div>
                    )}
                    <div className="flex justify-between">
                      <span className="text-slate-500">Saldo a Financiar:</span>
                      <span className="font-semibold">{formatCurrency(resultadoCotizacion.saldoFinanciar)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Tasa Efectiva Mensual:</span>
                      <span className="font-mono text-xs bg-slate-100 px-2 py-0.5 rounded">
                        {plazo > 6 ? `${resultadoCotizacion.interesMensual}%` : "0.00% (<= 6 meses)"}
                      </span>
                    </div>
                    <div className="pt-2 border-t flex justify-between items-center bg-amber-50 -mx-2 px-3 py-2 rounded-lg">
                      <span className="font-bold text-amber-900">Valor Total a ingresar en FRDI:</span>
                      <span className="font-extrabold text-amber-900 text-base">{formatCurrency(resultadoCotizacion.totalFrdi)}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {tab === "catalogo" && equipos.length > 0 && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-4 border-b bg-slate-50 flex flex-col md:flex-row gap-3 justify-between">
                  <input
                    type="text"
                    placeholder="Buscar por modelo, Smartflex o código SAP..."
                    value={busqueda}
                    onChange={e => setBusqueda(e.target.value)}
                    className="w-full md:w-80 rounded-lg border-slate-300 border px-3 py-2 text-sm bg-white"
                  />
                  <div className="flex flex-wrap gap-2">
                    <select
                      value={filtroMarca}
                      onChange={e => setFiltroMarca(e.target.value)}
                      className="rounded-lg border-slate-300 border px-3 py-2 text-sm bg-white"
                    >
                      {marcasUnicas.map(m => <option key={m} value={m}>Marca: {m}</option>)}
                    </select>
                    <select
                      value={filtroGama}
                      onChange={e => setFiltroGama(e.target.value)}
                      className="rounded-lg border-slate-300 border px-3 py-2 text-sm bg-white"
                    >
                      {["TODAS", "MUY BAJA", "BAJA", "MEDIA", "ALTA", "PREMIUM"].map(g => (
                        <option key={g} value={g}>Gama: {g}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 text-xs uppercase border-b">
                        <th className="py-3 px-4">Smartflex / SAP</th>
                        <th className="py-3 px-4">Modelo / Marca</th>
                        <th className="py-3 px-4">Gama</th>
                        <th className="py-3 px-4 text-right">Prepago (inc. IVA)</th>
                        <th className="py-3 px-4 text-right">Pospago (inc. IVA)</th>
                        <th className="py-3 px-4 text-right">Empresa (sin IVA)</th>
                        <th className="py-3 px-4">Estado</th>
                        <th className="py-3 px-4 text-center">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {equiposFiltrados.map(eq => {
                        const iva = Number(params.iva) || 0.15;
                        const gama = calcularGama(eq.pvp_pospago_sin_iva);
                        return (
                          <tr key={eq.codigo_smartflex} className="hover:bg-blue-50/50">
                            <td className="py-3 px-4 font-mono text-xs">
                              <div className="font-bold text-slate-800">{eq.codigo_smartflex}</div>
                              <div className="text-slate-400">{eq.codigo_sap}</div>
                            </td>
                            <td className="py-3 px-4">
                              <div className="font-semibold text-slate-900">{eq.modelo}</div>
                              <div className="text-xs text-slate-500">{eq.marca} • {eq.tecnologia}</div>
                            </td>
                            <td className="py-3 px-4">
                              <span className="px-2 py-0.5 text-xs font-semibold rounded bg-slate-100 text-slate-700">{gama}</span>
                            </td>
                            <td className="py-3 px-4 text-right font-medium">{formatCurrency(eq.pvp_prepago_sin_iva * (1 + iva))}</td>
                            <td className="py-3 px-4 text-right font-bold text-blue-800">{formatCurrency(eq.pvp_pospago_sin_iva * (1 + iva))}</td>
                            <td className="py-3 px-4 text-right text-slate-600">{formatCurrency(eq.pvp_empresa_sin_iva)}</td>
                            <td className="py-3 px-4">
                              <span className={`px-2 py-0.5 text-xs font-medium rounded-full ${String(eq.observacion).includes("NUEVO") ? "bg-emerald-100 text-emerald-800" : "bg-blue-100 text-blue-800"}`}>
                                {eq.observacion}
                              </span>
                            </td>
                            <td className="py-3 px-4 text-center">
                              <button
                                onClick={() => {
                                  setSmartflexSeleccionado(eq.codigo_smartflex);
                                  setTab("cotizador");
                                }}
                                className="bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition"
                              >
                                Cotizar
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {tab === "planes" && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 text-xs uppercase border-b">
                        <th className="py-3 px-4">Código</th>
                        <th className="py-3 px-4">Nombre del Plan</th>
                        <th className="py-3 px-4">Segmento</th>
                        <th className="py-3 px-4 text-right">Tarifa sin IVA</th>
                        <th className="py-3 px-4 text-right">Tarifa inc. IVA</th>
                        <th className="py-3 px-4 text-center">CBM</th>
                        <th className="py-3 px-4">Observaciones</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {planes.map((pl, idx) => (
                        <tr key={idx} className="hover:bg-slate-50">
                          <td className="py-3 px-4 font-mono text-xs font-bold">{pl.codigo}</td>
                          <td className="py-3 px-4 font-semibold text-slate-800">{pl.plan}</td>
                          <td className="py-3 px-4">
                            <span className={`px-2 py-0.5 text-xs font-semibold rounded ${pl.tipo === "CORPORATIVO" ? "bg-purple-100 text-purple-800" : "bg-sky-100 text-sky-800"}`}>
                              {pl.tipo}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right">{formatCurrency(pl.tarifa)}</td>
                          <td className="py-3 px-4 text-right font-bold text-slate-900">{formatCurrency(pl.tarifa * (1 + Number(params.iva)))}</td>
                          <td className="py-3 px-4 text-center font-semibold">{pl.cbm}</td>
                          <td className="py-3 px-4 text-slate-500 text-xs">{pl.observaciones}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
